# ============================================================
# Rebecca Carter — Sveltia CMS config
# ============================================================
# SETUP (one-time, done by Connor):
#   1. Create a GitHub OAuth App at
#      https://github.com/settings/developers
#        - Homepage URL:
#            https://rebecca-carter-website.cganderson2014.workers.dev
#        - Authorization callback URL:
#            https://rebecca-carter-website.cganderson2014.workers.dev/callback
#   2. Paste the OAuth App's Client ID and Client Secret into the
#      Worker's secrets in the Cloudflare dashboard (never into this
#      file; see the SETUP comment in functions/auth.js).
#
# Login is handled by this site's own Worker (worker.js), which routes
# /auth and /callback to functions/auth.js and functions/callback.js.
#
# AT THE CUSTOM DOMAIN CUTOVER: change base_url below to
# https://rebeccacarter.net and change the OAuth App's callback URL to
# https://rebeccacarter.net/callback. Both must name the same domain.
# ============================================================

backend:
  name: github
  repo: cander0110/rebecca-carter-website
  branch: main
  base_url: https://rebecca-carter-website.cganderson2014.workers.dev
  auth_endpoint: auth

# Default home for uploaded images, and the URL prefix written into
# data/*.json for them. Paintings override this below so their photos
# land in their own folder.
media_folder: assets/uploads
public_folder: /assets/uploads

collections:

  - name: paintings
    label: Paintings
    # Painting photos upload to assets/uploads/paintings. The leading
    # slash means "from the top of the repo", not relative to data/.
    media_folder: /assets/uploads/paintings
    public_folder: /assets/uploads/paintings
    files:
      - name: paintings
        label: Paintings
        file: data/paintings.json
        fields:
          - label: Paintings
            name: paintings
            widget: list
            summary: "{{title}} ({{category}})"
            fields:
              - { label: Title, name: title, widget: string, hint: "The name of the piece, as you want it shown on the site" }
              - label: Category
                name: category
                widget: select
                hint: "Which section of the Works page and Shop this appears under"
                options: [originals, prints, magnets, ornaments, earrings, aceos]
              - { label: Medium, name: medium, widget: string, required: false, hint: "e.g. Watercolor on linen" }
              - { label: Dimensions, name: dimensions, widget: string, required: false, hint: "e.g. 24 × 31 in." }
              - { label: Year, name: year, widget: string, required: false, hint: "The year you finished it, e.g. 2024" }
              - label: Price (USD)
                name: price
                widget: string
                required: false
                hint: "e.g. $850. Leave blank if not for sale."
              - { label: Photo, name: image, widget: image, required: false, hint: "Upload a photo of the painting from your computer or phone. Until you add one, the site shows a \"coming soon\" tile." }
              - label: Availability
                name: availability
                widget: select
                options: [available, sold, not-for-sale]
                default: available
                hint: "Pick not-for-sale to show the piece without a price"
              - label: Show in Shop
                name: inShop
                widget: boolean
                default: false
                hint: "Turn on to list this painting for sale in the Shop's Originals column"
              - { label: Description, name: description, widget: text, required: false, hint: "Optional. A sentence or two about the piece." }

  - name: photography
    label: Photography
    files:
      - name: photography
        label: Photography
        file: data/photography.json
        fields:
          - label: Photos
            name: photography
            widget: list
            summary: "{{category}}: {{title}}"
            fields:
              - { label: Title, name: title, widget: string, required: false, hint: "Optional. Leave blank for an untitled photo." }
              - label: Category
                name: category
                widget: select
                hint: "Which series this photo belongs to on the Works page"
                options: [portraits, documentary-events, nature-still-life, travel-places]
              - { label: Photo, name: image, widget: image, hint: "Upload the photo from your computer or phone" }
              - { label: Print Available, name: printAvailable, widget: boolean, default: true, hint: "Turn on if you sell prints of this photo" }
              - label: Print Price (USD)
                name: printPrice
                widget: string
                required: false
                hint: "e.g. $45. Leave blank if not priced yet."

  - name: shopProducts
    label: Shop Products
    files:
      - name: shopProducts
        label: Shop Products
        file: data/shopProducts.json
        fields:
          - label: Products
            name: products
            widget: list
            summary: "{{name}} ({{category}})"
            fields:
              - { label: Name, name: name, widget: string, hint: "What the product is called in the Shop" }
              - label: Category
                name: category
                widget: select
                hint: "Which column of the Shop page this product appears in"
                options:
                  - { label: "Painting Prints", value: paintingPrints }
                  - { label: "Photography Prints", value: photographyPrints }
                  - { label: Earrings, value: earrings }
                  - { label: "Hand-Painted Magnets", value: handPaintedMagnets }
                  - { label: "Hand-Painted Ornaments", value: handPaintedOrnaments }
                  - { label: "Trading Cards / ACEOs", value: tradingCardsAceos }
              - { label: Price (USD), name: price, widget: string, hint: "e.g. $35" }
              - { label: Photo, name: image, widget: image, required: false, hint: "Upload a photo of the product. Until you add one, the site shows a \"coming soon\" tile." }
              - { label: Description, name: description, widget: text, required: false, hint: "Optional. A sentence or two shown under the product name." }
              - label: Stripe Payment Link
                name: stripeLink
                widget: string
                required: false
                hint: "Optional. If set, overrides the category-wide link in data/paymentLinks.js for this one product."
              - { label: Available, name: available, widget: boolean, default: true, hint: "Turn off to mark this product as unavailable" }

  - name: shows
    label: Shows
    files:
      - name: shows
        label: Shows
        file: data/shows.json
        fields:
          - label: Shows
            name: shows
            widget: list
            summary: "{{title}} ({{status}})"
            fields:
              - { label: Title, name: title, widget: string, hint: "The name of the show or exhibition" }
              - { label: Venue, name: venue, widget: string, hint: "The gallery or space hosting it" }
              - { label: Location, name: location, widget: string, hint: "City, State" }
              - label: Dates
                name: dates
                widget: string
                hint: "Human-readable, e.g. \"June 6-28, 2025\" (past shows can just use the year)"
              - label: Start Date
                name: startDate
                widget: datetime
                type: date
                format: "YYYY-MM-DD"
                hint: "Used to sort shows and build the date badge on the home page"
              - { label: Opening Reception, name: opening, widget: string, required: false, hint: "Optional. e.g. \"Friday, June 6, 6-8 PM\"" }
              - label: Type
                name: type
                widget: select
                options: [Solo, Group, Duo]
                hint: "Solo is just you, Duo is you and one other artist, Group is three or more"
              - label: Status
                name: status
                widget: select
                options: [upcoming, past]
                hint: "Change to past once the show closes. This does not happen on its own."
              - { label: Description, name: description, widget: text, required: false, hint: "Optional. A sentence or two about the show." }
              - label: Photos
                name: images
                widget: list
                field: { label: Photo, name: image, widget: image }
                required: false
                hint: "Past shows only: a small gallery of work from this show"
              - label: Shop Link
                name: shopLink
                widget: string
                required: false
                hint: "Filename inside /pages/ to send visitors who want to buy from this show, e.g. shop.html"

  - name: printClubEpisodes
    label: Print Club Episodes
    files:
      - name: printClubEpisodes
        label: Print Club Episodes
        file: data/printClubEpisodes.json
        fields:
          - label: Episodes
            name: episodes
            widget: list
            summary: "{{name}} ({{date}})"
            fields:
              - { label: "Artist Name", name: name, widget: string, hint: "The featured artist's full name" }
              - { label: Photo, name: image, widget: image, required: false, hint: "Leave blank to show initials instead" }
              - { label: Initials, name: initials, widget: string, hint: "Shown in the avatar circle if there's no photo" }
              - { label: Medium, name: medium, widget: string, hint: "What kind of work they make, e.g. Ceramics" }
              - { label: Location, name: location, widget: string, hint: "City, State" }
              - { label: Quote, name: quote, widget: text, hint: "A line from the artist, shown with their episode. No quotation marks needed." }
              - { label: Episode Date, name: date, widget: string, hint: "e.g. February 2025" }
              - { label: Instagram Link, name: instagramUrl, widget: string, hint: "The full address of their Instagram profile, starting with https://" }

  - name: siteText
    label: Site Text
    files:
      - name: siteText
        label: Site Text
        file: data/siteText.json
        fields:
          - label: Home Hero Tagline
            name: heroTagline
            widget: text
            hint: "The line under the hero words on the home page"
          - label: About Blurb
            name: aboutBlurb
            widget: text
            hint: "Rebecca's bio paragraph on the home page"
          - label: Footer Availability Sentence
            name: footerAvailability
            widget: string
            hint: "Short line in the footer about current availability"
