<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rebecca Carter — Artist</title>
  <meta name="description" content="Rebecca Carter is an artist working in painting, print, and mixed media." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Injected by main.js -->
  <div id="site-nav"></div>

  <main>
    <section class="hero section container">
      <h1>Rebecca Carter</h1>
      <p class="hero-subtitle">Painting &middot; Printmaking &middot; Mixed Media</p>

      <!-- Replace this placeholder with a featured image or video.
           For an image: set data-src="assets/images/featured.jpg" on the <img> below.
           For a video:  swap the <img> for a <video> tag with the correct src. -->
      <div class="hero-featured">
        <div class="image-placeholder">
          Featured work — add an image or video to assets/
        </div>
      </div>
    </section>

    <section class="section container">
      <h2>Recent Work</h2>
      <div class="grid grid-3">
        <!-- Repeat these .grid-item blocks for each thumbnail.
             Set the <img> src to your actual image path. -->
        <div>
          <div class="grid-item">
            <div class="image-placeholder">Image</div>
          </div>
          <div class="grid-item-caption">
            <h3>Untitled I</h3>
            <p class="text-muted">Oil on linen, 2024</p>
          </div>
        </div>
        <div>
          <div class="grid-item">
            <div class="image-placeholder">Image</div>
          </div>
          <div class="grid-item-caption">
            <h3>Untitled II</h3>
            <p class="text-muted">Screenprint, 2024</p>
          </div>
        </div>
        <div>
          <div class="grid-item">
            <div class="image-placeholder">Image</div>
          </div>
          <div class="grid-item-caption">
            <h3>Untitled III</h3>
            <p class="text-muted">Mixed media, 2023</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Injected by main.js -->
  <div id="site-footer"></div>

  <script src="js/main.js"></script>
</body>
</html>
